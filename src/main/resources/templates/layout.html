<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(title, content)">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title th:replace="${title}">LMS</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
  <div class="container">
    <a class="navbar-brand fw-bold" th:href="@{/}">📚 Thư viện</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" th:href="@{/}">Trang chủ</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/register}">Đăng ký</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/request}">Mượn sách</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/approve}">Duyệt phiếu</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/return}">Trả sách</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/renew}">Gia hạn</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/readers}">Độc giả</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/loans}">Phiếu mượn</a></li>
      </ul>
    </div>
  </div>
</nav>
<div class="container pb-5">
  <th:block th:replace="${content}"/>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
