<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::main})}">
<head><title>Gia hạn mượn sách – LMS</title></head>
<body>
<main>
  <h2 class="mb-4">Gia hạn mượn sách (UC13)</h2>

  <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
  <div th:if="${error}"   class="alert alert-danger"  th:text="${error}"></div>

  <div th:if="${#lists.isEmpty(borrowedLoans)}" class="alert alert-info">
    Không có phiếu nào đang mượn.
  </div>

  <div th:each="l : ${borrowedLoans}" class="card mb-3 shadow-sm">
    <div class="card-header fw-bold">Phiếu #<span th:text="${l.id}"></span></div>
    <div class="card-body">
      <p class="mb-1"><strong>Độc giả:</strong> <span th:text="${l.reader.name}"></span></p>
      <p class="mb-1"><strong>Sách:</strong> <span th:text="${l.book.title}"></span></p>
      <p class="mb-1"><strong>Hạn trả hiện tại:</strong> <span th:text="${l.dueDate}"></span></p>
      <p class="mb-3">
        <span th:if="${l.renewed}" class="badge bg-secondary">Đã gia hạn – không thể gia hạn thêm</span>
        <span th:unless="${l.renewed}" class="badge bg-success">Chưa gia hạn</span>
      </p>

      <form th:action="@{/renew}" method="post" th:if="${!l.renewed}">
        <input type="hidden" name="loanId" th:value="${l.id}"/>
        <button type="submit" class="btn btn-warning btn-sm">Gia hạn (+7 ngày)</button>
      </form>
    </div>
  </div>
</main>
</body>
</html>
