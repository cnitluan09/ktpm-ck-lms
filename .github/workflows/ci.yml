name: CI – Library Management System

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-test:
    name: Unit Tests + JaCoCo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run unit tests & JaCoCo report
        run: mvn test jacoco:report --no-transfer-progress

      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

  e2e-test:
    name: E2E Tests (Selenium + Playwright)
    runs-on: ubuntu-22.04
    needs: unit-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install Playwright dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2t64

      - name: Install Playwright browsers
        run: |
          mvn test-compile exec:java@install-playwright-browsers \
          --no-transfer-progress

      - name: Install Playwright browsers
        run: mvn test-compile exec:java@install-playwright-browsers --no-transfer-progress

      - name: Build & run E2E tests
        run: mvn verify -Pe2e -Dheadless=true -Ddemo.pause=0 --no-transfer-progress
